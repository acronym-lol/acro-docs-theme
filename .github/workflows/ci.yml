name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generator tests
        run: npm test

      # The committed fixture sidebars must be exactly what the generator writes, so a
      # rule change shows up as a reviewable diff in the fixtures.
      - name: Fixture sidebars are current
        run: |
          node bin/acro-docs-sidebar.mjs fixtures/docs --check
          node bin/acro-docs-sidebar.mjs fixtures/site --check

      - name: Theme script parses
        run: node --check theme/acro-docsify.js

      # tokens.css is generated in acro-docs. It must exist and say so; editing it here
      # would be overwritten by the next export.
      - name: tokens.css is the generated file
        run: grep -q 'GENERATED. Do not edit this file by hand.' theme/tokens.css
