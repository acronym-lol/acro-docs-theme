# Copy to .github/workflows/acro-docs-sidebar.yml. It keeps docs/_sidebar.md generated
# from the docs/ folder, using the same rules as the acro-docs site. See
# https://github.com/acronym-lol/acro-docs-theme/blob/main/MIGRATING.md
name: Docs sidebar

on:
  push:
    paths:
      - 'docs/**'
      - '!docs/_sidebar.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sidebar:
    uses: acronym-lol/acro-docs-theme/.github/workflows/sidebar.yml@v1
